[package]
name = "arco"
version = "0.4.0"
edition = "2024"
description = "Automated Research into Computational Ontologies — a platform for discovering the conditions under which computation emerges"
repository = "https://github.com/kvernet/arco"
documentation = "https://docs.rs/arco"
readme = "README.md"
license = "MIT"
keywords = ["computation", "emergence", "complex-systems", "information-theory", "scientific-computing"]
categories = ["science", "simulation"]
rust-version = "1.85"

[dependencies]
ndarray = "0.17"
rand = "0.10"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }

[features]
default = []
serialize = ["serde"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1