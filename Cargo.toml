[package]
name = "arco"
version = "0.2.1"
rust-version = "1.85"
edition = "2024"
description = "Automated Research into Computational Ontologies — a platform for discovering the conditions under which computation emerges"
repository = "https://github.com/kvernet/arco"
documentation = "https://docs.rs/arco"
readme = "README.md"
license = "MIT"
keywords = ["computation", "emergence", "complex-systems", "information-theory", "scientific-computing"]
categories = ["science", "simulation"]

[dependencies]
ndarray = "0.17"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1